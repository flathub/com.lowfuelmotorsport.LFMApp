app-id: com.lowfuelmotorsport.LFMApp
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: lfm-app
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Notifications and tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # Steam libraries and Proton prefixes (ACC and AC documents live in compatdata/<appid>/pfx)
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  # Steam libraries on other drives
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media

modules:
  - name: lfm-app
    buildsystem: simple
    build-commands:
      - cp -a lfm-app /app/lfm-app
      - install -Dm755 lfm-app.sh /app/bin/lfm-app
      - install -Dm644 lfm-app/resources/linux/com.lowfuelmotorsport.LFMApp.desktop -t /app/share/applications
      - install -Dm644 lfm-app/resources/linux/com.lowfuelmotorsport.LFMApp.metainfo.xml -t /app/share/metainfo
      - install -Dm644 com.lowfuelmotorsport.LFMApp.png -t /app/share/icons/hicolor/512x512/apps
    sources:
      - type: archive
        url: https://downloads.livery.lowfuelmotorsport.com/lfm-hub-updates/lfm-app-1.2.4-linux-x64.tar.gz
        sha256: 3cd980701b32dec65101e77b20c638bacda494655c99d978a26452c069bd1eca
        dest: lfm-app
      - type: file
        path: lfm-app.sh
      - type: file
        path: com.lowfuelmotorsport.LFMApp.png
